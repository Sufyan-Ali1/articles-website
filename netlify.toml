[build]
  command = "npm run build"
  publish = ".next"
[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
# Explicitly run the Next.js adapter to package SSR routes and API functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Set API_BASE_URL, NEXT_PUBLIC_API_BASE_URL, SITE_URL, and secrets in Netlify.
