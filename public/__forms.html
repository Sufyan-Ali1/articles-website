<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Contact form definition</title>
  </head>
  <body>
    <!-- Netlify's build-time form definition; field names must match the React form. -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" type="text" /><input name="email" type="email" /><input
        name="reason"
        type="text"
      /><input name="article_url" type="url" /><textarea
        name="message"
      ></textarea
      ><input name="bot-field" type="text" />
    </form>
  </body>
</html>
